<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asnivo - Intelligence that evolves with every conversation</title>
<style>
  :root {
    --bg: #e9eef5; --panel: #f9fbfd; --ink: #18212f; --muted: #5b6677;
    --user: #22305c; --user-ink: #f4f6ff; --bot: #ffffff; --line: #d3dbe6;
    --accent: #3b4fd8; --err-bg: #fdecea; --err-ink: #8a1c13;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151e; --panel: #171e2b; --ink: #e6ebf3; --muted: #93a0b5;
      --user: #4a5fe0; --user-ink: #ffffff; --bot: #202a3b; --line: #2b3548;
      --accent: #8c9bff; --err-bg: #3a1d1b; --err-ink: #ffb4ab;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink);
         font: 16px/1.5 "Segoe UI", "Helvetica Neue", Arial, sans-serif;
         display: flex; justify-content: center; }
  .app { width: 100%; max-width: 720px; height: 100%; display: flex; flex-direction: column;
         background: var(--panel); border-inline: 1px solid var(--line); }
  header { display: flex; align-items: center; justify-content: space-between;
           padding: 14px 18px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 1.05rem; margin: 0; }
  header p { margin: 0; font-size: .82rem; color: var(--muted); }
  button { font: inherit; cursor: pointer; }
  #reset { background: none; border: 1px solid var(--line); color: var(--ink);
           padding: 6px 12px; border-radius: 8px; }
  #reset:hover { border-color: var(--accent); }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap;
         overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-ink);
              border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--line);
             border-bottom-left-radius: 4px; }
  .msg.error { align-self: stretch; max-width: 100%; background: var(--err-bg); color: var(--err-ink);
               border-radius: 8px; font-size: .92rem; }
  .msg.bot.typing { color: var(--muted); font-style: italic; }
  .msg code, .msg pre { font-family: Consolas, "SF Mono", monospace; font-size: .9em; }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 30ch; }
  form { display: flex; gap: 10px; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; font: inherit; padding: 10px 12px; border-radius: 10px;
             border: 1px solid var(--line); background: var(--bot); color: var(--ink); max-height: 140px; }
  #send { background: var(--accent); color: #fff; border: 0; padding: 0 20px; border-radius: 10px; font-weight: 600; }
  @media (prefers-color-scheme: dark) { #send { color: #10151e; } }
  #send:disabled { opacity: .55; cursor: not-allowed; }
  #status { font-size: .78rem; color: var(--muted); padding: 0 18px 8px; min-height: 1.2em; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>Asnivo</h1><p>Intelligence that evolves with every conversation.</p></div>
    <button id="reset" type="button">New chat</button>
  </header>
  <div id="log" role="log" aria-live="polite">
    <div class="empty" id="empty">Ask about a bug, a concept, or what to learn next.</div>
  </div>
  <div id="status"></div>
  <form id="form">
    <textarea id="input" rows="1" maxlength="2000" placeholder="Type your question" aria-label="Message"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>
<script>
const log = document.getElementById("log"), form = document.getElementById("form"),
      input = document.getElementById("input"), send = document.getElementById("send"),
      statusEl = document.getElementById("status");
let conversationId = null;   // a page load starts a new conversation
let generation = 0;          // bumped by New chat so late replies from the old chat are ignored
let pendingCtrl = null;

function add(kind, text) {
  const empty = document.getElementById("empty"); if (empty) empty.remove();
  const el = document.createElement("div");
  el.className = "msg " + kind;
  el.textContent = text;            // textContent: model output is never parsed as HTML
  log.appendChild(el); log.scrollTop = log.scrollHeight;
  return el;
}

async function submit(text) {
  const gen = generation;
  add("user", text);
  const typing = add("bot typing", "Asnivo is thinking...");
  send.disabled = true;
  const ctrl = new AbortController();
  pendingCtrl = ctrl;
  const timer = setTimeout(() => ctrl.abort(), 45000);
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, conversation_id: conversationId }),
      signal: ctrl.signal,
    });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (gen !== generation) return;   // New chat was pressed while waiting
    typing.remove();
    if (data.conversation_id) conversationId = data.conversation_id;
    if (!res.ok) { add("error", data.error || "The server returned an error (" + res.status + ")."); return; }
    add("bot", data.reply);
    statusEl.textContent = data.has_summary
      ? "Older messages are being summarised to save context."
      : data.stored_messages + " messages in memory";
  } catch (err) {
    if (gen !== generation) return;
    typing.remove();
    add("error", err.name === "AbortError"
      ? "The request timed out. Please try again."
      : "Could not reach the server. Is it running?");
  } finally {
    clearTimeout(timer);
    if (gen === generation) { send.disabled = false; input.focus(); }
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  input.value = ""; input.style.height = "auto";
  submit(text);
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px";
});
document.getElementById("reset").addEventListener("click", () => {
  const oldId = conversationId;
  generation++;                       // any reply still in flight is now stale
  conversationId = null;
  if (pendingCtrl) pendingCtrl.abort();
  send.disabled = false;
  log.innerHTML = '<div class="empty" id="empty">Ask about a bug, a concept, or what to learn next.</div>';
  statusEl.textContent = "";
  if (oldId) {
    fetch("/api/reset", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ conversation_id: oldId }) }).catch(() => {});
  }
});
</script>
</body>
</html>
